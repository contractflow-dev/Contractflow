
# Backing services start by default (`docker compose up -d`).
# The full containerised app runs under the `app` profile:
#   docker compose -f infra/docker-compose.yml --profile app up -d --build
# WEB_PORT / API_PORT move the app's host ports (see infra/dev-docker.env).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contractflow
      POSTGRES_USER: contractflow
      POSTGRES_PASSWORD: contractflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractflow -d contractflow"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: contractflow
      MINIO_ROOT_PASSWORD: contractflow-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  migrate:
    profiles: [app]
    image: contractflow-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command:
      - node
      - node_modules/typeorm/cli.js
      - migration:run
      - -d
      - dist/common/database/data-source.js
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://contractflow:contractflow@postgres:5432/contractflow
      DB_SSL: "false"
      WEB_URL: http://localhost:${WEB_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret-change-me-0123456789}
      MAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    profiles: [app]
    image: contractflow-api
    environment: *api-env
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
  web:
    profiles: [app]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle, so it must be reachable from the host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-3001}}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  minio_data:

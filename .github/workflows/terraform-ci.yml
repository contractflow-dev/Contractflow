name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'

  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Terraform configuration
        id: terraform-check
        shell: bash
        run: |
          if [ -d "infra/terraform" ] && find infra/terraform -name "*.tf" -type f | grep -q .; then
            echo "terraform_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform_present=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform configuration found. Skipping Terraform validation."
          fi

      - name: Setup Terraform
        if: steps.terraform-check.outputs.terraform_present == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        if: steps.terraform-check.outputs.terraform_present == 'true'
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        if: steps.terraform-check.outputs.terraform_present == 'true'
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        if: steps.terraform-check.outputs.terraform_present == 'true'
        working-directory: infra/terraform
        run: terraform validate

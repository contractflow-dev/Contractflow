databases:
  - name: contractflow-db
    databaseName: contractflow
    user: contractflow
    # add a plan that fits your budget

services:
  - type: web
    name: contractflow-api
    runtime: node
    healthCheckPath: /health

    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @contractflow/contracts-schema build
      pnpm --filter @contractflow/api build

    startCommand: pnpm --filter @contractflow/api start:prod

    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: contractflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false

  - type: web
    name: contractflow-web
    runtime: node
    healthCheckPath: /

    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile --prod=false
      pnpm --filter @contractflow/contracts-schema build
      pnpm --filter @contractflow/web build

    startCommand: pnpm --filter @contractflow/web start

    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false

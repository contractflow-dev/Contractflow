services:
  # =========================
  # ContractFlow API
  # =========================
  - type: web
    name: contractflow-api
    plan: free
    runtime: node
    rootDir: .
    healthCheckPath: /health

    buildCommand: |
      corepack enable
      NODE_ENV=development pnpm install --frozen-lockfile
      pnpm --filter @contractflow/api build

    startCommand: pnpm --filter @contractflow/api start

    envVars:
      - key: NODE_VERSION
        value: 20.11.0

      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CORS_ORIGIN
        sync: false

  # =========================
  # ContractFlow Web
  # =========================
  - type: web
    name: contractflow-web
    plan: free
    runtime: node
    rootDir: .
    healthCheckPath: /

    buildCommand: |
      corepack enable
      NODE_ENV=developmentpnpm install --frozen-lockfile
      pnpm --filter @contractflow/web build

    startCommand: pnpm --filter @contractflow/web start

    envVars:
      - key: NODE_VERSION
        value: 20.11.0

      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_API_URL
        sync: false